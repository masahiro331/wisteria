# Local development helper for the Phase 2 AI layer.
#
# `docker compose up -d` brings up an Ollama server reachable at
# http://localhost:11434, which is what internal/ai/ollama defaults to.
# Models are persisted by bind-mounting WISTERIA_OLLAMA_DIR (default
# ${HOME}/.ollama) into the container so a `docker compose down` does
# not throw away the multi-GB qwen3 weights.
#
# GPU notes:
#   * Linux + NVIDIA: uncomment the `deploy.resources` block below and
#     install the NVIDIA Container Toolkit on the host.
#   * Apple Silicon (M1/M2/M3): leave it commented. Docker Desktop on
#     macOS cannot pass the Apple GPU through to a Linux container,
#     so inference falls back to CPU and qwen3:8b takes minutes per
#     advisory. For Mac, the native Ollama install
#     (`brew install ollama`) is much faster — see
#     docs/operations/ollama-setup.md.

services:
  ollama:
    # Pinned so `docker compose pull` does not silently change the
    # server version mid-development. Bump manually when needed.
    image: ollama/ollama:0.21.2
    container_name: wisteria-ollama
    ports:
      # Bound to the loopback interface only so this dev helper does
      # not expose the unauthenticated /api/chat endpoint on every
      # host interface (shared dev box, cloud VM, lax firewall).
      # Replace with "0.0.0.0:11434:11434" if you need external access
      # and have other authentication in front.
      - "127.0.0.1:11434:11434"
    volumes:
      - ${WISTERIA_OLLAMA_DIR:-${HOME}/.ollama}:/root/.ollama
    restart: unless-stopped
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
